name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: pip install -e . pytest
      - name: Test suite (agent contracts + quilt receipts + family fixtures)
        run: python -m pytest tests/ -q
      - name: Offline receipted run
        run: python examples/receipt_offline_run.py --check
      - name: Lint
        run: pip install ruff && ruff check jev_ultrafast tests examples
